[project]
name = "trav-ai-control-sandbox"
version = "0.2.0"
description = "Sandbox for learning Inspect and running AI control experiments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "inspect-ai>=0.3.289",
    "openai>=3.49.0",
]

[dependency-groups]
dev = [
    "ipykernel",
    "ipywidgets",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["archive"]
